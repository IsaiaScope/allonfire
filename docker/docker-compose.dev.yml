name: allonfire

services:
  postgres:
    container_name: allonfire-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-allonfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-allonfire}
      POSTGRES_DB: ${POSTGRES_DB:-allonfire}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allonfire}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    container_name: allonfire-adminer
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  minio:
    container_name: allonfire-minio
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-allonfire}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-allonfire}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:

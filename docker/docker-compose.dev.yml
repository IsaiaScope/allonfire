name: allonfire

services:
  database:
    container_name: allonfire-database
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-allonfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-allonfire}
      POSTGRES_DB: ${POSTGRES_DB:-allonfire}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allonfire}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: allonfire-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory-policy volatile-lru
      --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  database-console:
    container_name: allonfire-database-console
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - database

  storage:
    container_name: allonfire-storage
    # MinIO stopped publishing images and deleted minio/minio from Docker Hub
    # (September 2026). This is its last release, rebuilt by Coolify's team;
    # pinned, so a new machine pulls exactly what the tests ran against.
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-allonfire}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-allonfire}
    command: server /data --console-address ":9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Every stored picture reaches a browser through it, by a link the API
  # signed (imgproxy; ADR 0027): it reads the closed bucket with the storage's
  # keys, resizes, and answers AVIF or WebP as the browser takes them. The key
  # and salt below are throwaway Local values (`LOCAL.IMAGE_SERVER`).
  image-server:
    container_name: allonfire-image-server
    image: ghcr.io/imgproxy/imgproxy:v4.0.20
    restart: unless-stopped
    environment:
      IMGPROXY_KEY: ${STORAGE_IMAGE_SERVER_KEY:-5ac692d6a2b19f10fdcdc2f2dd03efdf413a4108bf93d08508e9c4c6656d95f1}
      IMGPROXY_SALT: ${STORAGE_IMAGE_SERVER_SALT:-b8d9db70864d2cf60e0b5d06d04b8cb5}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://storage:9000
      IMGPROXY_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-allonfire}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-allonfire}
      # Only the Apps' bucket and a test run's (`testBucketName`), never another.
      IMGPROXY_ALLOWED_SOURCES: "s3://image/,s3://allonfire-test-"
      IMGPROXY_AUTO_AVIF: "true"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: "100"
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The image server's address: an nginx cache in front of it, so a link
  # already answered is never resized again (`configs.image-cache`).
  image-cache:
    container_name: allonfire-image-cache
    image: nginx:1.30.1-alpine
    restart: unless-stopped
    ports:
      - "9010:8080"
    configs:
      - source: image-cache
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      image-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: the bucket every stored picture lives in (ADR 0013, ADR 0027),
  # closed: no anonymous read; the image server reads it with the storage's
  # keys. Safe to re-run.
  storage-init:
    container_name: allonfire-storage-init
    # The server image ships mc; minio/mc is no longer on Docker Hub.
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      storage:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 ${STORAGE_ACCESS_KEY:-allonfire} ${STORAGE_SECRET_KEY:-allonfire} &&
      mc mb --ignore-existing local/image &&
      mc anonymous set none local/image
      "

  # Telemetry backend. Stores on the named volume below; Production stores on
  # MinIO instead (see docs/adr/0006-self-hosted-observability.md).
  telemetry:
    container_name: allonfire-telemetry
    image: openobserve/openobserve:v1.0.3
    restart: unless-stopped
    # Localhost only: the API runs on the host, nothing else needs it.
    ports:
      - "127.0.0.1:5080:5080"
    environment:
      # Not allonfire / allonfire like the rest of Local: OpenObserve refuses to
      # boot unless the user is an email and the password has upper, lower,
      # digit and symbol, and nothing turns that check off.
      ZO_ROOT_USER_EMAIL: allonfire@allonfire.local
      ZO_ROOT_USER_PASSWORD: Allonfire#1
      ZO_DATA_DIR: /data
      ZO_COMPACT_DATA_RETENTION_DAYS: "7"
      # On by default, reporting usage to the vendor; ADR 0006 keeps all
      # telemetry on our own machines.
      ZO_TELEMETRY: "false"
    volumes:
      - telemetry_data:/data
    # The image is distroless (no shell, no curl), so the check is the binary
    # itself: `node status` queries the running server over HTTP.
    healthcheck:
      test: ["CMD", "/openobserve", "node", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates the analytics and workflow databases if missing. An initdb.d script
  # would not work — it only runs against an empty data directory, and
  # database_data already exists on every machine that has run docker:up.
  # The wait loop covers a fresh volume: the database reports healthy over its unix
  # socket while initdb's temporary server still refuses TCP.
  database-init:
    container_name: allonfire-database-init
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: database
      PGUSER: ${POSTGRES_USER:-allonfire}
      PGPASSWORD: ${POSTGRES_PASSWORD:-allonfire}
      PGDATABASE: ${POSTGRES_DB:-allonfire}
    command: >
      sh -c "for i in $$(seq 30); do psql -c 'SELECT 1' >/dev/null 2>&1 && break; sleep 1; done;
      for db in analytics workflow; do
      psql -tAc \"SELECT 1 FROM pg_database WHERE datname = '$$db'\" | grep -q 1
      || psql -c \"CREATE DATABASE $$db\" || exit 1; done"
    depends_on:
      database:
        condition: service_healthy

  # Analytics. Idle until a frontend embeds its script.
  analytics:
    container_name: allonfire-analytics
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-allonfire}:${POSTGRES_PASSWORD:-allonfire}@database:5432/analytics
      APP_SECRET: allonfire-local-umami-secret
      # Umami otherwise calls out: a telemetry pixel, update checks, and website
      # icons from DuckDuckGo. PRIVATE_MODE disables every external call.
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      PRIVATE_MODE: "1"
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: Umami's first-run login is hardcoded (admin / umami) with no env
  # override, so this renames it to allonfire / allonfire once Umami's migrations
  # have created the table. A no-op once `admin` is gone. The hash is bcrypt of
  # "allonfire"; `$$` is compose's escape for a literal `$`.
  analytics-init:
    container_name: allonfire-analytics-init
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: database
      PGUSER: ${POSTGRES_USER:-allonfire}
      PGPASSWORD: ${POSTGRES_PASSWORD:-allonfire}
      PGDATABASE: analytics
    command:
      - psql
      - -c
      - UPDATE "user" SET username = 'allonfire', password = '$$2b$$10$$OD8Bk590E9I.hUMZye66O.CqXIpgD5lIUjwEj8gw9yedvYx9LFd02' WHERE username = 'admin'
    depends_on:
      analytics:
        condition: service_healthy

  # Workflow automation, pinned to the VPS's version. On first open n8n asks
  # to create the owner account. Secure cookies are off: localhost is plain HTTP.
  # The credentials encryption key lives in workflow_data/config, created on first
  # start; losing the volume makes stored credentials unreadable.
  workflow:
    container_name: allonfire-workflow
    image: docker.n8n.io/n8nio/n8n:2.26.3
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: database
      DB_POSTGRESDB_DATABASE: workflow
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-allonfire}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-allonfire}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      GENERIC_TIMEZONE: Europe/Rome
    volumes:
      - workflow_data:/home/node/.n8n
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  database_data:
  storage_data:
  telemetry_data:
  workflow_data:

configs:
  image-cache:
    content: |
      # Answers a signed image-server link it has already seen, so imgproxy
      # resizes each picture once per link, not once per viewer (the open-source
      # imgproxy keeps nothing itself). Kept identical in dev and prod
      # (service-names.test.ts).
      map $$http_accept $$image_format {
          ~image/avif avif;
          ~image/webp webp;
          default     other;
      }
      proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images:10m
                       max_size=5g inactive=30d use_temp_path=off;
      server {
          listen 8080;
          location = /health {
              access_log off;
              return 200;
          }
          location / {
              proxy_pass http://image-server:8080;
              proxy_cache images;
              # The whole path, signature and exp included: a hit needs the
              # exact signed link, so a tampered one always reaches imgproxy.
              # The format imgproxy picks from Accept is the only other part.
              proxy_cache_key "$$request_uri|$$image_format";
              # Every copy is checked with imgproxy before it is served (a 1 s
              # life, then If-None-Match): imgproxy checks the link (403, 404
              # past exp) and asks the bucket whether the file is unchanged,
              # answering 304 without resizing, or 404 once it was deleted or
              # renamed. The resize is what is saved; a revoked link dies at
              # once. Only a 200 is kept. The browser still gets imgproxy's
              # own Cache-Control.
              proxy_ignore_headers Cache-Control Expires Vary;
              proxy_cache_valid 200 1s;
              proxy_cache_revalidate on;
              proxy_cache_lock on;
              add_header X-Cache-Status $$upstream_cache_status always;
          }
      }

name: allonfire

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: allonfire
      POSTGRES_PASSWORD: allonfire_dev
      POSTGRES_DB: allonfire
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allonfire"]
      interval: 5s
      timeout: 5s
      retries: 5

  # When adding a new app, copy this block:
  # newapp:
  #   image: allonfire-newapp
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile
  #     args:
  #       APP_NAME: newapp
  #   ports:
  #     - "3200:3000"
  #   environment:
  #     DATABASE_URL: postgresql://allonfire:allonfire_dev@postgres:5432/allonfire
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres_test_data:

name: allonfire

services:
  social:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: social
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://social.isaiariva.com
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - N8N_API_KEY=${N8N_API_KEY}
      - SOCIAL_VIEWER_EMAIL=${SOCIAL_VIEWER_EMAIL:-}
      - SOCIAL_VIEWER_PASSWORD=${SOCIAL_VIEWER_PASSWORD:-}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - allonfire
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.allonfire-social.rule=Host(`social.isaiariva.com`)"
      - "traefik.http.routers.allonfire-social.entrypoints=websecure"
      - "traefik.http.routers.allonfire-social.tls.certresolver=letsencrypt"
      - "traefik.http.services.allonfire-social.loadbalancer.server.port=3000"

  laura:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: laura
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://laura.isaiariva.com
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - LAURA_VIEWER_EMAIL=${LAURA_VIEWER_EMAIL:-}
      - LAURA_VIEWER_PASSWORD=${LAURA_VIEWER_PASSWORD:-}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - allonfire
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.allonfire-laura.rule=Host(`laura.isaiariva.com`)"
      - "traefik.http.routers.allonfire-laura.entrypoints=websecure"
      - "traefik.http.routers.allonfire-laura.tls.certresolver=letsencrypt"
      - "traefik.http.services.allonfire-laura.loadbalancer.server.port=3000"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - allonfire
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.allonfire-minio.rule=Host(`minio.isaiariva.com`)"
      - "traefik.http.routers.allonfire-minio.entrypoints=websecure"
      - "traefik.http.routers.allonfire-minio.tls.certresolver=letsencrypt"
      - "traefik.http.routers.allonfire-minio.middlewares=minio-chain@file"
      - "traefik.http.services.allonfire-minio.loadbalancer.server.port=9001"

volumes:
  minio_data:
    external: true
    name: allonfire-minio-data

networks:
  allonfire:
    driver: bridge
  dokploy-network:
    external: true
    name: dokploy-network

name: allonfire

# The db-migrate image (packages/database/liquibase), shared by the two
# one-shot services that run before the Apps on every deploy (ADR 0008).
# Confined: read-only root filesystem, no Linux capabilities, no privilege
# escalation, a scratch /tmp for the JVM, and only the network that reaches
# dokploy-postgres.
x-db-job: &db-job
  build:
    context: ..
    dockerfile: packages/database/liquibase/Dockerfile
  image: allonfire-db-migrate
  restart: "no"
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment:
    - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
  networks:
    - dokploy-network

services:
  # First: a verified custom-format dump of allonfire, newest 14 kept. Same
  # disk as the database: this serves rollback, not disaster recovery.
  db-backup:
    <<: *db-job
    command: ["backup"]
    volumes:
      - db_backups:/backups

  # Then: apply the changelog (validated first), tag the release. The Apps
  # start only if this exits 0.
  db-migrate:
    <<: *db-job
    command: ["deploy"]
    # A stop mid-deploy waits for the running changeset instead of killing it
    # and leaving the changelog lock behind.
    stop_grace_period: 5m
    depends_on:
      db-backup:
        condition: service_completed_successfully

  laura:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: laura
        BETTER_AUTH_URL: https://laura.isaiariva.com
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://laura.isaiariva.com
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - LAURA_VIEWER_EMAIL=${LAURA_VIEWER_EMAIL:-}
      - LAURA_VIEWER_PASSWORD=${LAURA_VIEWER_PASSWORD:-}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - allonfire
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.allonfire-laura.rule=Host(`laura.isaiariva.com`)"
      - "traefik.http.routers.allonfire-laura.entrypoints=websecure"
      - "traefik.http.routers.allonfire-laura.tls.certresolver=letsencrypt"
      - "traefik.http.services.allonfire-laura.loadbalancer.server.port=3000"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - allonfire
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.allonfire-minio.rule=Host(`minio.isaiariva.com`)"
      - "traefik.http.routers.allonfire-minio.entrypoints=websecure"
      - "traefik.http.routers.allonfire-minio.tls.certresolver=letsencrypt"
      - "traefik.http.routers.allonfire-minio.middlewares=admin-gate@file"
      - "traefik.http.services.allonfire-minio.loadbalancer.server.port=9001"

volumes:
  minio_data:
    external: true
    name: allonfire-minio-data
  db_backups:
    name: allonfire-db-backups

networks:
  allonfire:
    driver: bridge
  dokploy-network:
    external: true
    name: dokploy-network

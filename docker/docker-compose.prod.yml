name: allonfire

# The db-migrate image (packages/database/liquibase), shared by the two
# one-shot services that run before the Apps on every deploy (ADR 0008).
# Confined: read-only root filesystem, no Linux capabilities, no privilege
# escalation, a scratch /tmp for the JVM, and only the network that reaches
# dokploy-postgres.
x-db-job: &db-job
  # Built by CI (.github/workflows/deploy.yml, ADR 0018); pulled on every deploy.
  image: ghcr.io/isaiascope/allonfire-db-migrate:prod
  pull_policy: always
  restart: "no"
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment:
    - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
  networks:
    - dokploy-network

services:
  # First: a verified custom-format dump of allonfire, newest 14 kept. Same
  # disk as the database: this serves rollback, not disaster recovery.
  db-backup:
    <<: *db-job
    command: ["backup"]
    volumes:
      - db_backups:/backups

  # Then: apply the changelog (validated first), tag the release. The Apps
  # start only if this exits 0.
  db-migrate:
    <<: *db-job
    command: ["deploy"]
    # A stop mid-deploy waits for the running changeset instead of killing it
    # and leaving the changelog lock behind.
    stop_grace_period: 5m
    depends_on:
      db-backup:
        condition: service_completed_successfully

  # Then: the Images' bucket with its read-only policy, only when missing.
  # Runs from the API's image, which holds the storage package.
  storage-setup:
    image: ghcr.io/isaiascope/allonfire-api:prod
    pull_policy: always
    restart: "no"
    command: ["node_modules/.bin/tsx", "../../packages/storage/src/features/image/setup/cli.ts"]
    depends_on:
      storage:
        condition: service_healthy
    environment:
      - STORAGE_ENDPOINT=http://storage:9000
      - STORAGE_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - STORAGE_SECRET_KEY=${MINIO_SECRET_KEY}
    networks:
      - allonfire

  # Every Deploy unit below is an image CI built (ADR 0018); compose recreates
  # only the ones whose :prod tag moved. Laura is out of Production until its
  # rebuild (ADR 0010).
  api:
    image: ghcr.io/isaiascope/allonfire-api:prod
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      storage-setup:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - API_REDIS_URL=${API_REDIS_URL:?API_REDIS_URL is required}
      - API_CORS_ORIGINS=https://${BACK_OFFICE_HOST:?BACK_OFFICE_HOST is required}
      - API_TRUSTED_PROXY_HOPS=1
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET is required}
      - AUTH_URL=https://${API_HOST:?API_HOST is required}
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
      - STORAGE_ENDPOINT=http://storage:9000
      - STORAGE_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - STORAGE_SECRET_KEY=${MINIO_SECRET_KEY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - allonfire
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.allonfire-api.rule=Host(`${API_HOST}`)"
      - "traefik.http.routers.allonfire-api.entrypoints=websecure"
      - "traefik.http.routers.allonfire-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.allonfire-api.loadbalancer.server.port=3000"

  # STORAGE_ENDPOINT, NEXT_PUBLIC_API_URL and BACK_OFFICE_URL are baked in at
  # build (deploy.yml); BACK_OFFICE_URL is also read at runtime, the same value.
  back-office:
    image: ghcr.io/isaiascope/allonfire-back-office:prod
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_AUTH_URL=http://api:3000/v1/auth
      - API_URL=http://api:3000
      - AUTH_APP=BACK_OFFICE
      - BACK_OFFICE_URL=${BACK_OFFICE_URL}
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/sign-in"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - allonfire
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.allonfire-back-office.rule=Host(`${BACK_OFFICE_HOST}`)"
      - "traefik.http.routers.allonfire-back-office.entrypoints=websecure"
      - "traefik.http.routers.allonfire-back-office.tls.certresolver=letsencrypt"
      - "traefik.http.services.allonfire-back-office.loadbalancer.server.port=3000"

  # One-shot, before storage starts: copies the data of the service's old
  # name (`minio`, volume allonfire-minio-data) into storage's own volume.
  # Docker cannot rename a volume. The marker makes every later deploy a
  # no-op; without it (a copy cut short) the volume is emptied and the copy
  # redone whole. The old volume is left untouched: it is the rollback.
  storage-move:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: "no"
    entrypoint: >
      /bin/sh -c "set -e;
      [ -f /to/.storage-moved ] && exit 0;
      rm -rf /to/* /to/.[!.]* /to/..?*;
      cp -a /from/. /to/;
      touch /to/.storage-moved"
    volumes:
      - old_storage_data:/from:ro
      - storage_data:/to
    network_mode: none

  storage:
    # MinIO deleted minio/minio from Docker Hub; the same pin as Local.
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - storage_data:/data
    depends_on:
      storage-move:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - allonfire
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.allonfire-storage.rule=Host(`minio.isaiariva.com`)"
      - "traefik.http.routers.allonfire-storage.entrypoints=websecure"
      - "traefik.http.routers.allonfire-storage.tls.certresolver=letsencrypt"
      - "traefik.http.routers.allonfire-storage.middlewares=admin-gate@file"
      - "traefik.http.services.allonfire-storage.loadbalancer.server.port=9001"

volumes:
  storage_data:
    name: allonfire-storage-data
  old_storage_data:
    external: true
    name: allonfire-minio-data
  db_backups:
    name: allonfire-db-backups

networks:
  allonfire:
    driver: bridge
  dokploy-network:
    external: true
    name: dokploy-network

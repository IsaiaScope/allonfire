name: CI
on:
  pull_request:
    branches: [dev, test]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Vercel Remote Cache, shared with local runs (`turbo login` + `turbo link`).
# Without the secret, turbo runs uncached and still passes.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # What `--affected` diffs against. Turbo would read GITHUB_BASE_REF as a
  # local branch, which checkout never creates, and fall back to everything.
  TURBO_SCM_BASE: origin/${{ github.base_ref }}

# One job per Stage (CONTEXT.md), each running the Stage's own command, as a
# Mac and the pre-commit hook do: what a Stage runs, and why, is
# packages/config/stages/stages.ts. `--affected` narrows Turbo's tools to what
# the PR changed; `--keep-going` reports every tool, not only the first red
# one. Each Stage writes its table (result, time, tests, Turbo's cache) to the
# job's summary page. The jobs run in parallel; build alone waits for static.
jobs:
  # Turbo diffs against the PR's base branch and adds every dependent, so a
  # shared package lists each App that reads it; the changed files add what
  # its graph does not see (root files, Markdown-only changes). `browser` says
  # whether an affected package has browser tests of its own (ui's), so they
  # run whenever it changes, whatever App reads it. The summary says what each
  # Stage covers on this run, and why e2e would not run.
  affected:
    name: affected
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
      browser: ${{ steps.browser.outputs.browser }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Affected Apps and Deploy units
        id: affected
        run: pnpm -s ci:affected "$TURBO_SCM_BASE" >> "$GITHUB_OUTPUT"
      - name: Affected browser tests
        id: browser
        run: echo "browser=$(pnpm -s turbo run test:browser --affected --dry=json | jq '[.tasks[] | select(.task == "test:browser" and .command != "<NONEXISTENT>")] | length > 0')" >> "$GITHUB_OUTPUT"
      - name: What this run checks
        env:
          APPS: ${{ steps.affected.outputs.apps }}
          BROWSER: ${{ steps.browser.outputs.browser }}
        run: |
          {
            echo "### What this run checks"
            echo ""
            echo "| Stage | runs | why |"
            echo "|---|---|---|"
            echo "| static | yes | every PR; lint, knip and jscpd over the whole repo, Turbo's checks on what changed |"
            echo "| test | yes | the affected packages' unit and integration tests, then the changelog against Prisma |"
            if [ "$APPS" != "[]" ] || [ "$BROWSER" = "true" ]; then
              echo "| e2e | yes | affected Apps: \`$APPS\`; a changed package with browser tests: $BROWSER |"
            else
              echo "| e2e | skipped | no App affected and no package with browser tests changed |"
            fi
            echo "| build | after static | the affected Apps' production builds |"
          } >> "$GITHUB_STEP_SUMMARY"

  static:
    name: static
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare
        uses: ./.github/actions/prepare
      # ShellCheck ships on GitHub's runners; actionlint and the migrate
      # image's build checks run in Docker, so CI skips none of them.
      - name: Static checks
        run: pnpm static --affected --keep-going

  # Each package's integration tests make their own Test database and bucket
  # on the Test services, which the Stage starts from the dev compose file, as
  # a Mac does.
  test:
    name: test
    runs-on: ubuntu-24.04
    environment: dev
    env:
      DATABASE_URL: postgresql://allonfire:allonfire@localhost:5432/allonfire
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: ${{ secrets.AUTH_URL }}
      API_REDIS_URL: redis://localhost:6379/0
      API_CORS_ORIGINS: http://localhost:3200
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: allonfire
      STORAGE_SECRET_KEY: allonfire
      STORAGE_IMAGE_SERVER_URL: http://localhost:9010/image
      STORAGE_IMAGE_SERVER_KEY: 5ac692d6a2b19f10fdcdc2f2dd03efdf413a4108bf93d08508e9c4c6656d95f1
      STORAGE_IMAGE_SERVER_SALT: b8d9db70864d2cf60e0b5d06d04b8cb5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Tests
        run: pnpm test --affected --keep-going

  # Browser tests for every affected package that has them (the Apps' and
  # ui's), and end-to-end tests for the affected Apps, on the Test services:
  # the API and the App as production builds.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    needs: affected
    if: needs.affected.outputs.apps != '[]' || needs.affected.outputs.browser == 'true'
    # Every value here exists only for this run's throwaway stack.
    env:
      DATABASE_URL: postgresql://allonfire:allonfire@localhost:5432/allonfire
      API_REDIS_URL: redis://localhost:6379/0
      API_LOG_LEVEL: warn
      AUTH_SECRET: e2e-secret-only-for-this-throwaway-stack-000
      # jscpd:ignore-start
      # The test job's Storage values, on purpose: a workflow-level env would
      # hand the throwaway stack's keys to every job, the build included.
      STORAGE_ACCESS_KEY: allonfire
      STORAGE_SECRET_KEY: allonfire
      STORAGE_IMAGE_SERVER_URL: http://localhost:9010/image
      STORAGE_IMAGE_SERVER_KEY: 5ac692d6a2b19f10fdcdc2f2dd03efdf413a4108bf93d08508e9c4c6656d95f1
      STORAGE_IMAGE_SERVER_SALT: b8d9db70864d2cf60e0b5d06d04b8cb5
      # jscpd:ignore-end
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm -s --filter @allonfire/back-office exec playwright --version)" >> "$GITHUB_OUTPUT"
      - name: Cache browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and WebKit
        run: pnpm --filter @allonfire/back-office exec playwright install chromium webkit --with-deps
      - name: Browser and end-to-end tests
        run: pnpm e2e --affected --keep-going
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/*/playwright-report
      - name: Where the report is
        if: failure()
        run: |
          echo "Playwright's report, traces and screenshots are the **playwright-report** artifact of this run." >> "$GITHUB_STEP_SUMMARY"

  # Only after static: the one job given the real dev secrets, so they reach
  # only code that passed lint and types, and a red PR spends no build.
  build:
    name: build
    runs-on: ubuntu-24.04
    needs: static
    environment: dev
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: ${{ secrets.AUTH_URL }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      BACK_OFFICE_URL: ${{ secrets.BACK_OFFICE_URL }}
      # The Back Office's server address of the API: validated at build, never called.
      API_URL: http://build.placeholder
      STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
      STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Build
        run: pnpm build --affected --keep-going

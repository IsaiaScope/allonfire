name: CI
on:
  pull_request:
    branches: [dev, test]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo Cache
        uses: rharkor/caching-for-turbo@v2.2.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Type check
        run: pnpm check-types
      - name: Lint
        run: pnpm lint

  test:
    runs-on: ubuntu-latest
    environment: dev
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: allonfire
          POSTGRES_PASSWORD: allonfire
          POSTGRES_DB: allonfire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allonfire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://allonfire:allonfire@localhost:5432/allonfire
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo Cache
        uses: rharkor/caching-for-turbo@v2.2.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Push schema to database
        run: pnpm db:push
      - name: Run tests
        run: pnpm turbo run test

  build:
    runs-on: ubuntu-latest
    needs: lint-types
    environment: dev
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Turbo Cache
        uses: rharkor/caching-for-turbo@v2.2.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build
        run: pnpm build

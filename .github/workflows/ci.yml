name: CI
on:
  pull_request:
    branches: [dev, test]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Vercel Remote Cache, shared with local runs (`turbo login` + `turbo link`).
# Without the secret, turbo runs uncached and still passes.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Type check
        run: pnpm check-types
      - name: Lint
        run: pnpm lint
      - name: Design copies in sync
        run: pnpm design:sync --check
      - name: i18n placeholders and generated types
        run: pnpm turbo run i18n:check
      # ShellCheck ships on GitHub's Ubuntu runners.
      - name: Shell scripts
        run: shellcheck -x packages/database/liquibase/*.sh packages/database/scripts/*.sh
      # The Dockerfile's `check=error=true` turns every build-check warning into
      # a failure.
      - name: Migrate image build checks
        run: docker build --check -f packages/database/liquibase/Dockerfile .

  test:
    runs-on: ubuntu-latest
    environment: dev
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: allonfire
          POSTGRES_PASSWORD: allonfire
          POSTGRES_DB: allonfire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allonfire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://allonfire:allonfire@localhost:5432/allonfire
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: ${{ secrets.AUTH_URL }}
      API_REDIS_URL: redis://localhost:6379/0
      API_CORS_ORIGINS: http://localhost:3200
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply the changelog
        run: pnpm db:update
      - name: Changelog matches the Prisma schema
        run: pnpm db:drift
      - name: Run tests
        run: pnpm turbo run test

  build:
    runs-on: ubuntu-latest
    needs: lint-types
    environment: dev
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: ${{ secrets.AUTH_URL }}
      STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
      STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build
        run: pnpm build

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 220" fill="none">
  <defs>
    <linearGradient id="flame-grad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFDD44"/>
      <stop offset="50%" stop-color="#FF8811"/>
      <stop offset="100%" stop-color="#E03C00"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B1A6B"/>
      <stop offset="50%" stop-color="#A8288A"/>
      <stop offset="100%" stop-color="#C435A8"/>
    </linearGradient>
    <filter id="text-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="flame-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF8811" flood-opacity="0.5"/>
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="box-shadow" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="social-text-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="740" height="220" rx="36" fill="#151515"/>

  <!-- AOF icon — scaled 0.38, centered vertically at 110 -->
  <g transform="translate(112, 110)">

    <!-- AOF letters -->
    <g filter="url(#text-shadow)">
      <g transform="scale(0.38)">
        <g transform="translate(-168, 0)">
          <path d="M0 110 L58 -120 L90 -120 L148 110 L114 110 L100 56 L48 56 L34 110 Z" fill="#C0C0C0" stroke="#C0C0C0" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke"/>
          <path d="M56 30 L74 -52 L92 30 Z" fill="#C0C0C0" stroke="#C0C0C0" stroke-width="4" stroke-linejoin="round" paint-order="stroke"/>
        </g>

        <g transform="translate(6, 0)">
          <ellipse cx="0" cy="-5" rx="78" ry="115" fill="#C0C0C0"/>
          <ellipse cx="0" cy="-5" rx="46" ry="78" fill="#C0C0C0"/>
        </g>

        <g transform="translate(82, 0)">
          <path d="M0 110 L0 -120 L110 -120 L110 -84 L36 -84 L36 -16 L90 -16 L90 18 L36 18 L36 110 Z" fill="#C0C0C0" stroke="#C0C0C0" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke"/>
        </g>
      </g>
    </g>

    <!-- Flame -->
    <g transform="translate(1.6, -1.3)" filter="url(#flame-glow)">
      <g transform="scale(2.2)">
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" fill="url(#flame-grad)" transform="translate(-12, -12)"/>
      </g>
    </g>
  </g>

  <!-- Pipe separator — vertically centered -->
  <rect x="227" y="50" width="3" height="120" rx="1.5" fill="#C0C0C0" opacity="0.25"/>

  <!-- SOCIAL banner — vertically centered at 110, equal gap from pipe -->
  <g transform="translate(482, 110)">
    <g filter="url(#box-shadow)">
      <rect x="-210" y="-55" width="420" height="110" rx="24" fill="url(#purple-grad)"/>
    </g>
    <g filter="url(#social-text-shadow)">
      <text x="0" y="22" text-anchor="middle" font-family="Oxanium, sans-serif" font-weight="400" font-size="62" letter-spacing="8" fill="white" stroke="white" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke">SOCIAL</text>
    </g>
  </g>
</svg>
